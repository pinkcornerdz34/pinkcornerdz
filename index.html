try{const u=new URLSearchParams(location.search).get('lang');LANG=u==='ar'||u==='fr'?u:(localStorage.getItem('pcs_lang')||'fr')}catch(e){}

const t=(k,v)=>String(TXT[LANG][k]||TXT.fr[k]||k).replace(/\{(\w+)\}/g,(m,x)=>v&&v[x]!=null?v[x]:m);

/ ---------- WhatsApp ----------

function orderText(p,q){const avail=p.inStock;
  const lines=[t('msgHi'),avail?t('msgOrder'):t('msgAsk'),'',t('msgName')+' : '+p.name];
  if(p.barcode)lines.push(t('msgRef')+' : '+p.barcode);
  lines.push(t('msgPrice')+' : '+money(p.price));
  if(avail){lines.push(t('msgQty')+' : '+q);lines.push(t('msgTotal')+' : '+money(p.price*q));lines.push('');lines.push(t('msgDeliv',deliv))}
  return lines.join('\n')}

/ ---------- navigation: product pages are #p=ID (shareable, back button works) ----------
let CATF='',QUERY='',SORT='';
function pushState(st){try{history.pushState(st,'',st.p?'#p='+encodeURIComponent(st.p):location.pathname+location.search)}catch(e){}}
function hashProduct(){const m=/[#&]p=([^&]+)/.exec(location.hash);return m?decodeURIComponent(m[1]):''}
function route(){const p=hashProduct();if(p)showProduct(p,true);else showHome(true)}
addEventListener('popstate',route);addEventListener('hashchange',route);

/ ---------- rendering ----------
const photo=(p,i,full)=>{const x=(p.photos||[])[i||0];return x?(full?x.url:x.thumb):''};
function setStatic(){
  const h=document.documentElement;h.lang=LANG;h.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  $('strip').innerHTML=t('strip',{zone:esc(deliv.zone),fee:esc(deliv.fee)});
  $('tagline').textContent=LANG==='ar'?'ملابس داخلية فاخرة':'Luxury Lingerie';
  ['kick','htitle','hsub','tcats','tcatsub','tshop','tshopsub','fabout','faboutx','fvisit','fdeliv'].forEach(k=>{$(k).textContent=t(k)});
  $('hcta').innerHTML=esc(t('hcta'))+'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  $('q').placeholder=t('search');
  const so=$('sort').options;so[0].textContent=t('sort');so[1].textContent=t('pa');so[2].textContent=t('pd');so[3].textContent=t('nm');
  $('fig').href=SHOP.instagram||'#';
  $('faddrx').textContent=SHOP.address||'';$('faddr').href=MAPS+encodeURIComponent(SHOP.address||'');
  $('fhours').textContent=t('hours',{h:SHOP.hours||''});
  $('fdelivx').textContent=t('delivx',deliv);$('fpay').textContent=t('pay');
  $('fwax').textContent=t('contact');$('fwa').href=waLink(t('msgContact'));$('wafab').href=waLink(t('msgContact'));
  $('copy').textContent=t('copy',{y:new Date().getFullYear()});$('vhint').textContent=t('zoom');
  const md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',t('desc'));
  const heroP=PRODUCTS.find(p=>p.inStock&&photo(p,0))||PRODUCTS.find(p=>photo(p,0));
  if(heroP){$('herobg').style.backgroundImage='url("'+photo(heroP,0,true)+'")';$('hero').classList.remove('noimg')}
}
function drawCats(){const cats=CAT.categories||[];$('catsec').classList.toggle('hide',cats.length<2);
  const tile=(name,label,p)=>`<button class="cat${CATF===name?' on':''}" data-cat="${esc(name)}"><div class="ci">${p&&photo(p,0)?`<img loading="lazy" src="${esc(photo(p,0))}" alt="">`:esc((label||'?').slice(0,1))}</div><span>${esc(label)}</span></button>`;
  $('cats').innerHTML=tile('',t('all'),PRODUCTS.find(p=>photo(p,0)))+cats.map(c=>tile(c.name,c.name,PRODUCTS.find(p=>(p.category||'Other')===c.name&&photo(p,0)))).join('')}
function visible(){const q=QUERY.trim().toLowerCase();
  let l=PRODUCTS.filter(p=>(!CATF||(p.category||'Other')===CATF)&&(!q||(p.name+' '+(p.category||'')+' '+(p.barcode||'')+' '+(p.description||'')).toLowerCase().indexOf(q)>=0));
  if(SORT==='pa')l=l.slice().sort((a,b)=>a.price-b.price);else if(SORT==='pd')l=l.slice().sort((a,b)=>b.price-a.price);else if(SORT==='nm')l=l.slice().sort((a,b)=>a.name.localeCompare(b.name));
  else l=l.slice().sort((a,b)=>(b.inStock-a.inStock));   / available articles first
  return l}
function card(p){const a=photo(p,0),b=photo(p,1);
  return `<a class="card${p.inStock?'':' out'}" href="#p=${encodeURIComponent(p.id)}" data-id="${esc(p.id)}"><div class="ph">${a?`<img loading="lazy" src="${esc(a)}" alt="${esc(p.name)}">`:'<div class="noph">PC</div>'}${b?`<img class="alt" loading="lazy" src="${esc(b)}" alt="">`:''}${p.inStock?'':`<span class="oos">${esc(t('oos'))}</span>`}</div><div class="nm">${esc(p.name)}</div><div class="pr">${esc(money(p.price))}</div></a>`}
function message(kind){   / friendly message instead of an empty page
  const setup=kind==='setup';
  return `<div class="msg"><div class="mono" style="margin:0 auto">PC</div><h3>${esc(setup?t('setupTitle'):t('errTitle'))}</h3><p>${esc(setup?t('setupText'):t('errText'))}</p>
    <div class="row">${setup?'':`<button class="b" data-retry="1"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>${esc(t('retry'))}</button>`}
    <a class="b wa2" href="${esc(waLink(t('msgContact')))}" target="_blank" rel="noopener">WhatsApp</a>${SHOP.instagram?`<a class="b" href="${esc(SHOP.instagram)}" target="_blank" rel="noopener">Instagram</a>`:''}</div></div>`}
function drawGrid(){
  if(STATE==='loading'&&!PRODUCTS.length){$('count').textContent='';$('filter').innerHTML='';
    $('grid').innerHTML=Array.from({length:8},()=>'<div class="skcard"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>').join('');return}
  if((STATE==='error'||STATE==='setup')&&!PRODUCTS.length){$('count').textContent='';$('filter').innerHTML='';$('grid').innerHTML=message(STATE);return}
  const l=visible();
  $('count').textContent=l.length===1?t('count1'):t('count',{n:l.length});
  $('filter').innerHTML=CATF?`<span class="chip">${esc(CATF)} <button data-clear="1" aria-label="×">×</button></span>`:'';
  $('grid').innerHTML=(STATE==='offline'?`<div class="note" style="grid-column:1/-1">${esc(t('offline'))}</div>`:'')+(l.length?l.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><div class="mono">PC</div>${esc(PRODUCTS.length?t('none'):t('empty'))}</div>`);
  imgFallbacks($('grid'))}
function imgFallbacks(root){root.querySelectorAll('img').forEach(i=>{i.onerror=()=>{if(i.classList.contains('alt'))i.remove();else{i.style.display='none'}}})}
function showHome(fromNav){$('pProduct').classList.add('hide');$('pHome').classList.remove('hide');document.title=(SHOP.slogan||'Pink Corner DZ | Luxury Lingerie');if(!fromNav)pushState({})}

/ ---------- product page ----------
let CUR=null,QTY=1;
function showProduct(id,fromNav){const p=PRODUCTS.find(x=>String(x.id)===String(id));if(!p){showHome(true);return}
  CUR=p;QTY=1;if(!fromNav)pushState({p:p.id});
  const ph=(p.photos||[]);
  $('pProduct').innerHTML=`<a href="./" class="back" id="pback"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>${esc(t('back'))}</a>
  <div class="pp"><div class="gal">
    <div class="slides" id="slides">${ph.length?ph.map((x,i)=>`<div class="sl" data-i="${i}"><img src="${esc(x.thumb)}" alt="${esc(p.name)}" ${i?'loading="lazy"':''}></div>`).join(''):'<div class="sl"><div class="noph" style="position:absolute;inset:0;display:grid;place-items:center;font:600 64px/1 var(--serif);color:var(--pink)">PC</div></div>'}</div>
    ${ph.length>1?`<button class="nav prev" data-go="-1" aria-label="‹"><svg class="chev" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="nav next" data-go="1" aria-label="›"><svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <div class="dots" id="dots">${ph.map((x,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><div class="thumbs" id="pthumbs">${ph.map((x,i)=>`<img src="${esc(x.thumb)}" data-i="${i}" class="${i?'':'on'}" alt="">`).join('')}</div>`:''}
  </div>
  <div class="info">${p.category?`<div class="cat2">${esc(p.category)}</div>`:''}<h1>${esc(p.name)}</h1>
    <div class="price">${esc(money(p.price))}</div>
    <div class="stock${p.inStock?'':' out'}"><i></i>${esc(p.inStock?t('instock'):t('outstock'))}</div>
    ${p.description?`<div class="desc">${esc(p.description)}</div>`:''}
    ${p.inStock?`<div class="qty"><span>${esc(t('qty'))}</span><div class="st"><button id="qm" aria-label="−">−</button><b id="qv">1</b><button id="qp" aria-label="+">+</button></div></div>`:'<div style="height:16px"></div>'}
    <a class="wa${p.inStock?'':' ask'}" id="order" target="_blank" rel="noopener"><svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.5.7 4.8 2 6.8L3 29l6.8-2.2c1.9 1 4 1.6 6.2 1.6 7 0 12.7-5.6 12.7-12.6S23 3 16 3z"/></svg>${esc(p.inStock?t('order'):t('ask'))}</a>
    <div class="perks"><div><svg viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>${esc(t('pdeliv',deliv))}</div>
      <div><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l2-3h12"/></svg>${esc(t('ppay'))}</div>
      <div><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>${esc(t('pwa'))}</div></div>
    ${p.barcode?`<div class="ref">${esc(t('ref'))} ${esc(p.barcode)}</div>`:''}
  </div></div>`;
  imgFallbacks($('pProduct'));updateOrder();
  $('pHome').classList.add('hide');$('pProduct').classList.remove('hide');window.scrollTo(0,0);document.title=p.name+' · Pink Corner DZ';
  const sl=$('slides');sl.addEventListener('scroll',()=>{const i=Math.round(Math.abs(sl.scrollLeft)/sl.clientWidth);markSlide(i)},{passive:true})}
function markSlide(i){document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i));document.querySelectorAll('#pthumbs img').forEach((d,k)=>d.classList.toggle('on',k===i))}
function goSlide(i){const sl=$('slides');if(!sl)return;const n=sl.children.length;i=(i+n)%n;sl.scrollTo({left:(LANG==='ar'?-1:1)*i*sl.clientWidth,behavior:'smooth'});markSlide(i)}
function curSlide(){const sl=$('slides');return sl?Math.round(Math.abs(sl.scrollLeft)/sl.clientWidth):0}
function updateOrder(){if(!CUR)return;const o=$('order');if(o)o.href=waLink(orderText(CUR,QTY));const v=$('qv');if(v)v.textContent=QTY}

/ ---------- full-screen zoom ----------
function openViewer(i){if(!CUR||!(CUR.photos||[]).length)return;
  $('vs').innerHTML=CUR.photos.map(x=>`<div class="vsl"><img src="${esc(x.url)}" alt=""></div>`).join('');
  $('viewer').classList.remove('hide');document.body.style.overflow='hidden';
  const vs=$('vs');requestAnimationFrame(()=>{vs.scrollLeft=(LANG==='ar'?-1:1)*i*vs.clientWidth})}
function closeViewer(){$('viewer').classList.add('hide');document.body.style.overflow=''}

/ ---------- events ----------
document.addEventListener('click',e=>{const el=e.target.closest('[data-id],[data-cat],[data-clear],[data-l],[data-go],[data-retry],#pback,#home,#searchbtn,#qm,#qp,.sl,#pthumbs img,#vclose,.vsl img');if(!el)return;
  if(el.matches('[data-id]')){e.preventDefault();showProduct(el.dataset.id)}
  else if(el.matches('[data-cat]')){CATF=el.dataset.cat;drawCats();drawGrid();$('shop').scrollIntoView({behavior:'smooth'})}
  else if(el.matches('[data-clear]')){CATF='';drawCats();drawGrid()}
  else if(el.matches('[data-retry]')){STATE='loading';drawGrid();load()}
  else if(el.matches('[data-l]')){LANG=el.dataset.l;try{localStorage.setItem('pcs_lang',LANG)}catch(x){}setStatic();drawCats();drawGrid();if(CUR&&!$('pProduct').classList.contains('hide'))showProduct(CUR.id,true)}
  else if(el.matches('[data-go]')){goSlide(curSlide()+Number(el.dataset.go))}
  else if(el.id==='pback'||el.id==='home'){e.preventDefault();CUR=null;showHome()}
  else if(el.id==='searchbtn'){$('searchbar').classList.toggle('hide');if(!$('searchbar').classList.contains('hide'))$('q').focus()}
  else if(el.id==='qm'){QTY=Math.max(1,QTY-1);updateOrder()}
  else if(el.id==='qp'){QTY=Math.min(20,QTY+1);updateOrder()}
  else if(el.matches('#pthumbs img')){goSlide(Number(el.dataset.i))}
  else if(el.matches('.sl')){openViewer(Number(el.dataset.i||0))}
  else if(el.id==='vclose'){closeViewer()}
  else if(el.matches('.vsl img')){el.classList.toggle('z')}});
$('q').addEventListener('input',()=>{QUERY=$('q').value;if($('pHome').classList.contains('hide'))showHome();drawGrid()});
$('sort').addEventListener('change',()=>{SORT=$('sort').value;drawGrid()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/ ---------- loading the catalogue ----------
const configured=()=>!!SITE.catalogUrl&&!/PASTE_/.test(SITE.catalogUrl);
const timeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
function jsonp(url,ms){return new Promise((ok,no)=>{   / old browsers / blocked requests: <script> with a callback
  const cb='pcCatalog'+Date.now(),s=document.createElement('script');
  const done=()=>{clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
  const timer=setTimeout(()=>{done();no(new Error('timeout'))},ms);
  window[cb]=d=>{done();d&&d.ok?ok(d):no(new Error('bad catalogue'))};
  s.onerror=()=>{done();no(new Error('network'))};
  s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;document.head.appendChild(s)})}
async function fetchCatalog(){
  const url=SITE.catalogUrl;
  try{const r=await timeout(fetch(url,{cache:'no-store'}),15000);const d=await r.json();if(d&&d.ok)return d;throw new Error('bad catalogue')}
  catch(e){return await jsonp(url,15000)}}
function apply(d){CAT=d;PRODUCTS=d.products||[];SHOP=Object.assign({},FALLBACK,d.info||{});setDeliv();setStatic();drawCats();drawGrid();addStructuredData()}
async function load(){
  if(!configured()){STATE='setup';drawGrid();return}
  try{const d=await fetchCatalog();STATE='ok';apply(d);try{localStorage.setItem('pc_catalog',JSON.stringify({t:Date.now(),d}))}catch(e){}
    if(hashProduct()&&$('pProduct').classList.contains('hide'))route()}
  catch(e){STATE=PRODUCTS.length?'offline':'error';drawGrid()}}
function addStructuredData(){   / helps search engines understand the products
  try{const old=$('ld-items');if(old)old.remove();const s=document.createElement('script');s.type='application/ld+json';s.id='ld-items';
    s.textContent=JSON.stringify({'@context':'https:/schema.org','@type':'ItemList',itemListElement:PRODUCTS.slice(0,60).map((p,i)=>({'@type':'ListItem',position:i+1,item:{'@type':'Product',name:p.name,
      image:photo(p,0,true)||undefined,description:p.description||undefined,sku:p.barcode||undefined,category:p.category||undefined,
      offers:{'@type':'Offer',price:p.price,priceCurrency:'DZD',availability:p.inStock?'https:/schema.org/InStock':'https:/schema.org/OutOfStock'}}}))});
    document.head.appendChild(s)}catch(e){}}

/ ---------- start: last saved catalogue at once, then a fresh one ----------
try{const c=JSON.parse(localStorage.getItem('pc_catalog')||'null');if(c&&c.d&&c.d.ok){STATE='offline';apply(c.d);STATE='loading'}}catch(e){}
setStatic();drawCats();drawGrid();if(hashProduct())route();
load();
window.__shop={t,orderText,waLink,visible,load,state:()=>STATE};   / read by the automated tests only
})();
</script>
